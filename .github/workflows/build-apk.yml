name: Build Signed Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build web application
        run: npm run build

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Generate Release Keystore
        run: |
          cd android/app
          if [ ! -f release.keystore ]; then
            echo "Generating release signing keystore..."
            keytool -genkey -v -keystore release.keystore \
              -alias androidreleasekey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=EMF Meter, OU=Mobile, O=Ghost EMF, L=City, ST=State, C=US"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build Signed Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify Signed APK
        run: |
          echo "Locating built APKs:"
          ls -lh android/app/build/outputs/apk/release/
          
          # Find the signed release APK
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            echo "Signed Release APK successfully generated!"
          else
            echo "Searching for generated APKs..."
            find android/app/build/outputs/apk/ -name "*.apk"
          fi

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EMF-Meter-Signed-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }} - EMF Meter Signed APK
          body: |
            ### 📱 EMF & Acoustic Meter Android Release
            
            This release contains the signed, installable Android APK:
            - **Live 5-LED EMF Meter** (Green -> Yellow -> Orange -> Red)
            - **Magnetic Flux Sensor Telemetry** (µT and mG)
            - **Tare / Calibration Baseline**
            - **Live Waveform Graph & Spike Alerts**
            - **Acoustic / Sound Spectrum Analyzer**
            
            Download `app-release.apk` below and install directly on your Android phone.
          files: android/app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
